# Layer 7 System Endpoints
# GET /api/v1/health
# GET /api/v1/schema/incident
# GET /api/v1/schema/incident/versions
# GET /api/v1/system/llm/models
# POST /api/v1/system/llm/test
# POST /api/v1/system/llm/pull
# GET /api/v1/system/llm/providers/config
# PUT/DELETE /api/v1/system/llm/providers/config/{provider}
# POST /api/v1/system/llm/providers/config/{provider}/validate
# POST/DELETE /api/v1/system/llm/providers/config/{provider}/models
# GET/PUT /api/v1/system/llm/external-consent

health:
  get:
    operationId: getHealth
    summary: System health check
    description: |
      Returns the health status of all FireForm components: database, the
      default LLM provider (Ollama, OpenAI, Gemini, Anthropic or a custom
      OpenAI compatible server), Whisper transcription, and file storage.
      GET /system/llm/models covers every enabled provider.
      Returns 200 even when degraded (so load balancers don't kill it), 503
      only if the system is truly unhealthy and cannot serve any requests.
    tags:
      - system
    responses:
      "200":
        description: System is healthy or degraded
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/HealthStatus"
            examples:
              healthy:
                summary: All systems operational
                value:
                  status: "healthy"
                  version: "1.0.0"
                  uptime_seconds: 86400
                  components:
                    database:
                      status: "healthy"
                      response_time_ms: 2
                    llm:
                      status: "healthy"
                      response_time_ms: 15
                      provider: "ollama"
                      model_loaded: "llama3:8b"
                      provider_version: "0.3.0"
                      models_available:
                        - name: "llama3:8b"
                          size_gb: 4.7
                          quantization: "Q4_K_M"
                          loaded: true
                        - name: "mistral:7b"
                          size_gb: 4.1
                          quantization: "Q4_0"
                          loaded: false
                      current_load:
                        active_requests: 1
                        queued_requests: 0
                    whisper:
                      status: "healthy"
                      response_time_ms: 10
                    storage:
                      status: "healthy"
                      disk_free_gb: 120.5
              degraded:
                summary: Some components have issues
                value:
                  status: "degraded"
                  version: "1.0.0"
                  uptime_seconds: 3600
                  components:
                    database:
                      status: "healthy"
                      response_time_ms: 2
                    llm:
                      status: "degraded"
                      response_time_ms: 5000
                      provider: "ollama"
                      detail: "High latency model may be loading"
                      current_load:
                        active_requests: 3
                        queued_requests: 2
                    whisper:
                      status: "unhealthy"
                      detail: "Whisper model not loaded"
                    storage:
                      status: "healthy"
                      disk_free_gb: 120.5
      "503":
        description: System is unhealthy cannot serve requests
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/HealthStatus"
            example:
              status: "unhealthy"
              version: "1.0.0"
              uptime_seconds: 10
              components:
                database:
                  status: "unhealthy"
                  detail: "Connection refused"
                llm:
                  status: "unhealthy"
                  provider: "ollama"
                  detail: "Connection refused"

schema_incident:
  get:
    operationId: getIncidentSchema
    summary: Get the canonical FireForm JSON Schema
    description: |
      Returns the full canonical FireForm incident JSON Schema (JSON Schema
      draft-07). Clients can use this to validate incident data locally before
      submitting. This is a schema-as-API pattern for interoperability.
    tags:
      - system
    responses:
      "200":
        description: Full JSON Schema document
        content:
          application/json:
            schema:
              type: object
              description: JSON Schema draft-07 document for the canonical incident model
            example:
              $schema: "http://json-schema.org/draft-07/schema#"
              title: "FireForm Canonical Incident"
              type: "object"
              properties:
                schema_version:
                  type: "string"

schema_versions:
  get:
    operationId: getSchemaVersions
    summary: Get schema version history
    description: |
      Returns the version history of the canonical FireForm incident schema,
      including changelogs and whether each version introduced breaking changes.
      Useful for clients tracking schema evolution across FireForm updates.
    tags:
      - system
    responses:
      "200":
        description: Schema version history
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/system.yaml#/SchemaVersion"
            example:
              - version: "1.1.0"
                released_at: "2026-02-01T00:00:00Z"
                changelog: "Added NERIS fields replacing legacy NFIRS. Added wildland.aerial_operations. Updated incident.types to include neris_code."
                breaking_changes: true
              - version: "1.0.0"
                released_at: "2024-01-01T00:00:00Z"
                changelog: "Initial canonical schema with NFIRS support."
                breaking_changes: false

llm_models:
  get:
    operationId: listLLMModels
    summary: List the LLM providers and models that can fill forms
    description: |
      Every enabled provider with the models it can run. A provider is enabled
      when its <PROVIDER>_MODELS setting is not empty and its key or URL is set.
      Hosted providers only show up when LLM_ALLOW_EXTERNAL is true. The list is
      cached for a minute, refresh=true reads it again from each provider.
    tags:
      - system
    parameters:
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Skip the cache and ask every provider again
    responses:
      "200":
        description: Enabled providers and their models
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/LLMModels"
            example:
              default:
                provider: "ollama"
                model: "qwen2.5:1.5b"
              providers:
                - provider: "ollama"
                  available: true
                  default_model: "qwen2.5:1.5b"
                  models:
                    - name: "qwen2.5:1.5b"
                      size_gb: 0.92
                      quantization: "Q4_K_M"
                      loaded: true
                      installed: true
                  downloadable:
                    - name: "qwen2.5:3b"
                      installed: false
                    - name: "llama3.2:3b"
                      installed: false
                - provider: "gemini"
                  available: true
                  default_model: "gemini-2.5-flash"
                  models:
                    - name: "gemini-2.5-flash"
                    - name: "gemini-2.5-pro"
                - provider: "anthropic"
                  available: false
                  default_model: "claude-sonnet-4-5"
                  detail: "anthropic rejected the API key: Invalid Anthropic API Key. Check ANTHROPIC_API_KEY."
                  error_code: "LLM_AUTH_FAILED"
                  models: []
      "500":
        description: The LLM settings are wrong. message names the setting and the fix.
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            example:
              error_code: "LLM_CONFIG_ERROR"
              message: "GEMINI_API_KEY is set but GEMINI_MODELS is empty. Add GEMINI_MODELS=gemini-2.5-flash, a comma separated list, or * for every model gemini lists."

llm_test:
  post:
    operationId: testLLMModel
    summary: Check that a model actually answers
    description: |
      Sends a short prompt to the model and checks it comes back as valid
      JSON. Use it after changing provider settings, or to confirm a model
      before picking it. A model that fails returns 200 with ok false and the
      reason, so the client can show it.
    tags:
      - system
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../schemas/system.yaml#/LLMTestRequest"
          example:
            provider: "gemini"
            model: "gemini-2.5-flash"
    responses:
      "200":
        description: The test ran. ok says whether the model answered.
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/LLMTestResult"
            examples:
              ok:
                summary: Model answered
                value:
                  provider: "gemini"
                  model: "gemini-2.5-flash"
                  ok: true
                  latency_ms: 840
              failed:
                summary: Model did not answer
                value:
                  provider: "ollama"
                  model: "llama3:8b"
                  ok: false
                  latency_ms: 12
                  detail: "Ollama has no model llama3:8b. Pull it with: ollama pull llama3:8b"
                  error_code: "LLM_MODEL_NOT_FOUND"
      "422":
        description: The provider or model is not one GET /system/llm/models lists
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            example:
              error_code: "LLM_NOT_AVAILABLE"
              message: "openai is not enabled on this server."
      "500":
        description: The LLM settings are wrong. message names the setting and the fix.
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            example:
              error_code: "LLM_CONFIG_ERROR"
              message: "GEMINI_API_KEY is set but GEMINI_MODELS is empty. Add GEMINI_MODELS=gemini-2.5-flash, a comma separated list, or * for every model gemini lists."

llm_pull:
  post:
    operationId: pullLLMModel
    summary: Pull an AI model from Ollama
    description: |
      Streams Ollama pull progress as newline-delimited JSON (application/x-ndjson).
      HTTP 200 only means the stream started; a pull succeeded only when a line
      contains `"status":"success"`. An `"error"` line or a truncated stream means
      failure even though the response status is 200. The provider must be ollama
      (default). The model must be allowed by OLLAMA_MODELS and, when
      OLLAMA_MODELS=*, by OLLAMA_INSTALLABLE_MODELS. After a successful pull the
      model catalog cache is refreshed so GET /system/llm/models lists the new
      model without waiting for the cache TTL.
    tags:
      - system
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/system.yaml#/LLMPullRequest"
          example:
            provider: "ollama"
            model: "qwen2.5:3b"
    responses:
      "200":
        description: Pull stream (success or failure is in the NDJSON lines)
        content:
          application/x-ndjson:
            schema:
              type: string
              description: One JSON object per line, as returned by Ollama /api/pull
            examples:
              success:
                summary: Successful pull
                value: |
                  {"status": "pulling manifest"}
                  {"status": "downloading", "completed": 50, "total": 100}
                  {"status": "success"}
              failed:
                summary: Pull failed mid-stream
                value: |
                  {"status": "pulling manifest"}
                  {"error": "pull access denied"}
      "422":
        description: Invalid model name, provider is not ollama, or model not installable
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            examples:
              not_installable:
                summary: Model not in the installable set
                value:
                  error_code: "LLM_NOT_AVAILABLE"
                  message: "secret:model cannot be pulled. With OLLAMA_MODELS=*, allowed models are: qwen2.5:1.5b, qwen2.5:3b, qwen2.5:7b, llama3.2:3b."
              validation:
                summary: Invalid model name
                value:
                  error_code: "VALIDATION_ERROR"
                  message: "Request validation failed"
      "503":
        description: Ollama could not be reached before the stream started
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            example:
              error_code: "LLM_UNAVAILABLE"
              message: "Could not reach Ollama at http://ollama:11434. Check OLLAMA_HOST: Connection refused"

llm_provider_configs:
  get:
    operationId: getLLMProviderConfigs
    summary: List provider configuration status
    description: |
      Returns configuration metadata for editable external providers. API keys
      are never returned. credential_status is unavailable when a saved key
      cannot be decrypted with the current master key.
    tags: [system]
    responses:
      "200":
        description: Provider configuration status
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/LLMProviderCredentialList"

llm_provider_config:
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        $ref: "../schemas/enums.yaml#/LLMProvider"
  put:
    operationId: saveLLMProviderConfig
    summary: Save provider credentials and custom settings
    description: |
      Stores API keys encrypted at rest and returns only status metadata. A
      remote provider requires external-processing consent. The custom provider
      may set a base URL and structured-output behavior.
    tags: [system]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/system.yaml#/LLMProviderCredentialRequest"
          example:
            api_key: "write-only"
    responses:
      "200":
        description: Saved provider status; API key is never included
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/LLMProviderCredentialStatus"
      "422":
        description: Invalid provider configuration or external consent is required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            examples:
              external_consent:
                value:
                  error_code: "LLM_EXTERNAL_CONSENT_REQUIRED"
                  message: "Allow external processing before configuring a provider outside the local network."
      "503":
        description: The master encryption key cannot be read or created
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            example:
              error_code: "LLM_SECRET_KEY_UNAVAILABLE"
              message: "LLM master key is unavailable."
  delete:
    operationId: deleteLLMProviderConfig
    summary: Delete provider configuration and its manual models
    tags: [system]
    responses:
      "200":
        description: Configuration and associated manual model IDs deleted
        content:
          application/json:
            example:
              status: success
      "422":
        description: Provider cannot be configured through this endpoint
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"

llm_provider_validation:
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        $ref: "../schemas/enums.yaml#/LLMProvider"
  post:
    operationId: validateLLMProviderConfig
    summary: Validate candidate credentials without saving them
    description: Queries the provider's model list. Credentials in this request
      are used only for validation and are not persisted.
    tags: [system]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/system.yaml#/LLMProviderCredentialRequest"
    responses:
      "200":
        description: Validation outcome; failures are returned with ok false
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/LLMProviderValidationResult"
      "422":
        description: Provider is not configurable or request fields are invalid
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"

llm_manual_models:
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        $ref: "../schemas/enums.yaml#/LLMProvider"
  post:
    operationId: validateAndAddLLMManualModel
    summary: Validate and save a manually entered model ID
    description: |
      Sends a short test generation to the selected model before saving its ID.
      This is useful for custom OpenAI-compatible servers that do not expose a
      model-list endpoint.
    tags: [system]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/system.yaml#/LLMManualModelRequest"
    responses:
      "200":
        description: Validation outcome; successful IDs are persisted
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/LLMManualModelResult"
      "422":
        description: Provider or model ID is invalid
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
  delete:
    operationId: deleteLLMManualModel
    summary: Delete a manually entered model ID
    tags: [system]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/system.yaml#/LLMManualModelRequest"
    responses:
      "200":
        description: Manual model ID deleted if present
        content:
          application/json:
            example:
              status: success
      "422":
        description: Provider or model ID is invalid
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"

llm_external_consent:
  get:
    operationId: getLLMExternalConsent
    summary: Get external processing consent
    tags: [system]
    responses:
      "200":
        description: Effective consent and its source
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/LLMExternalConsent"
  put:
    operationId: setLLMExternalConsent
    summary: Set local external processing consent
    description: This setting is local to the installation and is not user-scoped.
    tags: [system]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/system.yaml#/LLMExternalConsentRequest"
    responses:
      "200":
        description: Updated consent status
        content:
          application/json:
            schema:
              $ref: "../schemas/system.yaml#/LLMExternalConsent"

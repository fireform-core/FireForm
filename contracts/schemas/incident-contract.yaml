      type: integer
      nullable: true
    sex:
      type: string
      nullable: true
    chief_complaint:
      type: string
      nullable: true
    disposition:
      type: string
      nullable: true
    transported:
      type: boolean
    date_of_birth:
      type: string
      format: date
      nullable: true

    ems_agency_responded:
      type: string
      nullable: true
    nemsis_report_required:
      type: boolean
    nemsis_report_ids:
      type: array
      items:
        type: string

EMSPatient:
  type: object
  properties:
    patient_ref_id:
      type: string

      $ref: "#/Weather"
    environmental_impact:
      x-extraction: gated
      x-triggers:
        - runoff
        - contamination
        - contaminated
        - waterway
        - river
        - creek
        - stream
        - soil
        - pollution
        - wildlife
        - groundwater
        - drain
      $ref: "#/EnvironmentalImpact"
    infrastructure_impact:
      x-extraction: gated
      x-triggers:
        - power
        - powerline
        - electric
        - utility
        - utilities
        - outage
        - road closed
        - road closure

      properties:
        erosion_control_acres:
          type: number
        reseeding_acres:
          type: number
        hazard_tree_removal_required:
          type: boolean
    next_inspection_date:
      type: string
      format: date
      nullable: true
    investigation_ongoing:
      type: boolean

PeriodicReporting:

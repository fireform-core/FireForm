      type: object
      properties:
        firefighters:
          type: integer
        crew_supervisors:
          type: integer
        engineers:
          type: integer
        incident_command:
          type: integer
        support_staff:
          type: integer
    apparatus:
      type: array
      items:
        $ref: "#/Apparatus"
    crew_types:
      type: array
      items:
        type: string

Apparatus:
  type: object
  properties:
    type:
      type: string
    count:
      type: integer

Weather:
  type: object
  properties:
    on_arrival:
      $ref: "#/WeatherReading"
    worst_conditions:
      $ref: "#/WeatherReadingExtended"
    factors_influencing_fire:
      type: array
      items:
        type: string

WeatherReading:
  type: object
  properties:
    datetime:
      type: string
      format: date-time
    temperature_f:
      type: number
    relative_humidity_percent:
      type: number
    wind_speed_mph:
      type: number
    wind_direction:
      type: string
    haines_index:
      type: integer
      nullable: true

WeatherReadingExtended:
  type: object
  properties:
    datetime:
      type: string
      format: date-time
    temperature_f:
      type: number
    relative_humidity_percent:
      type: number
    wind_speed_mph:
      type: number
    wind_gusts_mph:
      type: number
      nullable: true

EnvironmentalImpact:
  type: object

  properties:
    contributes_to_monthly_report:
      type: boolean
    contributes_to_quarterly_report:
      type: boolean
    contributes_to_annual_report:
      type: boolean
    neris_submitted:
      type: boolean
    neris_submitted_at:
      type: string
      format: date-time
      nullable: true
    state_submitted:
      type: boolean
    state_submitted_at:
      type: string
      format: date-time
      nullable: true

Attachments:
  type: object
  properties:
    maps:
      type: boolean
    photos_count:
      type: integer
    weather_charts:
      type: boolean
    resource_tracking_logs:
      type: boolean
    incident_action_plans:
      type: boolean
    attachment_refs:
      type: array
      items:
        type: object
        properties:
          ref_id:
            type: string
            format: uuid
          filename:
            type: string
          content_type:
            type: string
          size_bytes:
            type: integer

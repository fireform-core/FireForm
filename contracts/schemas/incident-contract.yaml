# Canonical FireForm Incident Schema
# This is the master superset schema single source of truth for all downstream forms

IncidentContract:
  type: object
  description: |
    The canonical FireForm incident data model. This is the superset schema containing
    every field any downstream form could need. Form-specific mappers select only the
    relevant fields for each agency template.
  properties:
    schema_version:
      type: string
      description: Schema version identifier
      example: "1.1.0"
    schema_name:
      type: string
      description: Schema name identifier
      enum:
        - fireform_incident_contract

    extraction_metadata:
      $ref: "#/ExtractionMetadata"
    report_metadata:
      $ref: "#/ReportMetadata"
    incident:
      $ref: "#/Incident"
    location:
      $ref: "#/Location"
    fire:
      $ref: "#/Fire"
    wildland:
      $ref: "#/Wildland"
    structure:
      $ref: "#/Structure"
    casualties:
      $ref: "#/Casualties"
    ems:
      $ref: "#/EMS"
    hazmat:
      $ref: "#/Hazmat"
    arson:
      $ref: "#/Arson"
    responding_agencies:
      $ref: "#/RespondingAgencies"
    resources_deployed:
      $ref: "#/ResourcesDeployed"
    weather:
      $ref: "#/Weather"
    environmental_impact:
      $ref: "#/EnvironmentalImpact"
    infrastructure_impact:
      $ref: "#/InfrastructureImpact"
    near_miss_and_safety:
      $ref: "#/NearMissAndSafety"
    lessons_learned:
      $ref: "#/LessonsLearned"
    follow_up:
      $ref: "#/FollowUp"
    periodic_reporting:
      $ref: "#/PeriodicReporting"
    attachments:
      $ref: "#/Attachments"

# --- Sub-schemas ---

ExtractionMetadata:
  type: object
  properties:
    extract_id:
      type: string
      format: uuid
    input_id:
      type: string
      format: uuid
    input_type:
      type: string
      enum: [voice, text]
    extracted_at:
      type: string
      format: date-time
    llm_model:
      type: string
      example: "llama3:8b"
    confidence_score:
      type: number
      minimum: 0
      maximum: 1
      description: Overall confidence score from the LLM extraction (0.0–1.0)
    completeness:
      $ref: "#/Completeness"
    applicable_forms:
      type: array
      items:
        $ref: "../schemas/enums.yaml#/FormType"

Completeness:
  type: object
  description: |
    Tells the system which forms can be fully auto-generated vs which need
    manual review. Recalculated server-side after every PATCH /extract.
  properties:
    overall_percent:
      type: integer
      minimum: 0
      maximum: 100
    missing_fields:
      type: array
      items:
        type: string
      description: JSON paths of fields that have no value
    low_confidence_fields:
      type: array
      items:
        type: string
      description: JSON paths of fields where LLM confidence is low
    inferred_fields:
      type: array
      items:
        type: string
      description: JSON paths of fields that were inferred (not explicitly stated)
    forms_fully_generatable:
      type: array
      items:
        $ref: "../schemas/enums.yaml#/FormType"
    forms_needing_review:
      type: array
      items:
        $ref: "../schemas/enums.yaml#/FormType"
    forms_missing_data:
      type: array
      items:
        $ref: "../schemas/enums.yaml#/FormType"

ReportMetadata:
  type: object
  properties:
    report_id:
      type: string
      example: "FF-2024-CA-0157"
    incident_number:
      type: string
      example: "CA-SQF-2024-0421"
    report_date:
      type: string
      format: date
    report_time:
      type: string
      format: time
    report_status:
      $ref: "../schemas/enums.yaml#/ReportStatus"
    reporting_unit:
      $ref: "#/ReportingUnit"
    prepared_by:
      type: array
      items:
        $ref: "#/Personnel"
    reviewed_by:
      type: array
      items:
        $ref: "#/Reviewer"
    submission_log:
      type: array
      items:
        type: object
        properties:
          form_type:
            $ref: "../schemas/enums.yaml#/FormType"
          submitted_at:
            type: string
            format: date-time
          submitted_to:
            type: string

ReportingUnit:
  type: object
  properties:
    station_name:
      type: string
    station_id:
      type: string
    agency_name:
      type: string
    agency_id:
      type: string
      format: uuid
    agency_type:
      type: string

Personnel:
  type: object
  properties:
    name:
      type: string
    badge_number:
      type: string
    rank:
      type: string
    role:
      type: string
    contact_number:
      type: string
    signature_captured:
      type: boolean

Reviewer:
  type: object
  properties:
    name:
      type: string
    badge_number:
      type: string
    rank:
      type: string
    role:
      type: string
    reviewed_at:
      type: string
      format: date-time
    approved:
      type: boolean

Incident:
  type: object
  properties:
    name:
      type: string
      description: Human-readable incident name
    types:
      type: array
      items:
        $ref: "#/IncidentType"
    start_datetime:
      type: string
      format: date-time
    alarm_datetime:
      type: string
      format: date-time
    first_arrival_datetime:
      type: string
      format: date-time
    containment_datetime:
      type: string
      format: date-time
      nullable: true
    controlled_datetime:
      type: string
      format: date-time
      nullable: true
    cleared_datetime:
      type: string
      format: date-time
      nullable: true
    total_duration_hours:
      type: number
      nullable: true
    narrative:
      type: string
      description: Free text summary of the incident
    raw_transcript:
      type: string
      description: Original voice or text input verbatim

IncidentType:
  type: object
  properties:
    primary:
      type: boolean
    category:
      $ref: "../schemas/enums.yaml#/IncidentCategory"
    subcategory:
      type: string
    neris_code:
      type: string
      description: NERIS incident type code (replaces NFIRS as of Feb 2026)
    nfirs_code:
      type: string
      description: Legacy NFIRS incident type code

Location:
  type: object
  properties:
    address:
      type: string
      nullable: true
    nearest_landmark:
      type: string
      nullable: true
    nearest_town:
      type: string
      nullable: true
    county:
      type: string
      nullable: true
    state:
      type: string
      nullable: true
    country:
      type: string
      nullable: true
    postal_code:
      type: string
      nullable: true
    coordinates:
      $ref: "#/Coordinates"
    ignition_point_coordinates:
      $ref: "#/CoordinatesBasic"
    elevation_range_ft:
      type: string
      nullable: true
    legal_description:
      type: string
      nullable: true
    jurisdiction:
      type: object
      properties:
        federal:
          type: boolean
        state:
          type: boolean
        private:
          type: boolean
        tribal:
          type: boolean
    property_type:
      type: string
      nullable: true
    property_use:
      type: string
      nullable: true
    dispatch_center:
      type: string
      nullable: true

Coordinates:
  type: object
  properties:
    latitude:
      type: number
    longitude:
      type: number
    accuracy_meters:
      type: number

CoordinatesBasic:
  type: object
  properties:
    latitude:
      type: number
    longitude:
      type: number

Fire:
  type: object
  properties:
    cause_category:
      type: string
      nullable: true
    cause_specific:
      type: string
      nullable: true
    cause_certainty:
      $ref: "../schemas/enums.yaml#/CauseCertainty"
    arson_suspected:
      type: boolean
    material_first_ignited:
      type: string
      nullable: true
    fuel_types:
      type: array
      items:
        type: string
    fire_spread_directions:
      type: array
      items:
        type: string
    rate_of_spread:
      $ref: "../schemas/enums.yaml#/RateOfSpread"
    flame_lengths_ft:
      type: string
      nullable: true
    spotting_distance_miles:
      type: number
      nullable: true
    unusual_behaviors:
      type: array
      items:
        type: string
    detector_present:
      type: boolean
      nullable: true
    detector_operated:
      type: boolean
      nullable: true
    suppression_system_present:
      type: boolean
      nullable: true
    suppression_system_operated:
      type: boolean
      nullable: true
    estimated_damage_usd:
      type: number
      nullable: true
    contents_loss_usd:
      type: number
      nullable: true

Wildland:
  type: object
  properties:
    is_wildland_incident:
      type: boolean
    total_acres_burned:
      type: number
      nullable: true
    land_ownership_breakdown:
      type: object
      properties:
        federal_acres:
          type: number
        state_acres:
          type: number
        private_acres:
          type: number
        tribal_acres:
          type: number
    percent_contained:
      type: integer
      minimum: 0
      maximum: 100
    fire_lines:
      type: object
      properties:
        primary_line_miles:
          type: number
        secondary_line_miles:
          type: number
        dozer_line_miles:
          type: number
        hand_line_miles:
          type: number
    aerial_operations:
      type: object
      properties:
        water_drops_gallons:
          type: integer
        retardant_drops_gallons:
          type: integer
        total_flight_hours:
          type: number
    containment_strategies:
      type: array
      items:
        type: string

Structure:
  type: object
  properties:
    is_structure_involved:
      type: boolean
    structures_threatened:
      type: integer
      nullable: true
    structures_damaged:
      type: integer
      nullable: true
    structures_destroyed:
      type: integer
      nullable: true
    structures_protected:
      type: integer
      nullable: true
    construction_type:
      type: string
      nullable: true
    stories:
      type: integer
      nullable: true
    area_sqft:
      type: number
      nullable: true
    occupancy_at_time:
      type: integer
      nullable: true

Casualties:
  type: object
  properties:
    civilian:
      type: array
      items:
        $ref: "#/CivilianCasualty"
    responder:
      type: array
      items:
        $ref: "#/ResponderCasualty"
    total_civilian_injuries:
      type: integer
    total_civilian_fatalities:
      type: integer
    total_responder_injuries:
      type: integer
    total_responder_fatalities:
      type: integer

CivilianCasualty:

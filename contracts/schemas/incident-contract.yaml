    agency:
      type: string
    role:
      type: string
    injury_type:
      type: string
    severity:
      $ref: "../schemas/enums.yaml#/InjurySeverity"
    treatment:
      type: string
      nullable: true
    transported:
      type: boolean
    hospital:
      type: string
      nullable: true
    return_to_duty_date:
      type: string
      format: date
      nullable: true
    osha_recordable:
      type: boolean
    nfirs_5_required:
      type: boolean

EMS:
  type: object
  properties:
    ems_response_required:
      type: boolean
    patients:
      type: array
      items:
        $ref: "#/EMSPatient"
    total_patients:

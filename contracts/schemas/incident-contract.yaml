        $ref: "#/InfrastructureItem"

InfrastructureItem:
  type: object
  properties:
    type:
      type: string
    unit:
      type: string
    quantity:
      type: number
    severity:
      type: string

NearMissAndSafety:
  type: object
  properties:
    near_miss_events:
      type: array
      items:
        type: object
        properties:
          description:
            type: string
          date:
            type: string
            format: date
          contributing_factors:
            type: array
            items:
              type: string
          lessons_learned:
            type: string
            nullable: true
          corrective_action:
            type: string
            nullable: true
    safety_breaches:
      type: integer
    weather_related_risks:
      type: array
      items:
        type: string

LessonsLearned:
  type: object
  properties:
    successful_tactics:
      type: array
      items:
        type: string
    areas_for_improvement:
      type: array
      items:
        type: string
    recommendations:
      type: array
      items:
        type: string

FollowUp:
  type: object
  properties:
    mop_up:
      type: object
      properties:
        percent_complete:
          type: integer
        estimated_completion_date:
          type: string
          format: date
        personnel_assigned:
          type: integer
    rehabilitation:

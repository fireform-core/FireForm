      nullable: true
    watershed_impact:
      type: string
      nullable: true
    soil_erosion_risk:
      type: string
      nullable: true
    sensitive_species_affected:
      type: array
      items:
        type: string
    air_quality_impact:
      type: string
      nullable: true

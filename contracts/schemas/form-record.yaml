# Form generation related schemas

GenerateFormsRequest:
  type: object
  description: |
    One request generates any number of forms. The normal flow: the user
    reviews the extraction, looks at the readiness matrix, selects the ready
    templates they want, and submits their template_ids here. Every value is
    read from the incident row's contract document, the single store of
    incident data (incident_id comes back in the extraction response).
    Generation is pure lookup and draw (no LLM), so even a large batch
    completes in seconds.
  required:
    - incident_id
  properties:
    incident_id:
      type: string
      format: uuid
      description: Incident whose contract document the forms are filled from
    template_ids:
      type: array
      items:
        type: string
        format: uuid
      description: Templates to generate. When omitted, every template the
        readiness matrix reports as ready is generated.
    options:
      type: object
      properties:
        output_format:
          $ref: "../schemas/enums.yaml#/OutputFormat"
        force_partial:
          type: boolean
          default: false
          description: Also generate templates that are not ready, leaving
            their missing fields blank on the PDF

BatchGenerateResponse:
  type: object
  required:
    - batch_id
    - status
    - incident_id
  properties:
    batch_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [processing]
    incident_id:
      type: string
      format: uuid
    forms_queued:
      type: array
      items:
        type: object
        properties:
          form_id:
            type: string
            format: uuid
          template_id:
            type: string
            format: uuid
          form_type:
            $ref: "../schemas/enums.yaml#/FormType"
    forms_skipped:
      type: array
      items:
        type: object
        properties:
          template_id:
            type: string
            format: uuid
          form_type:
            $ref: "../schemas/enums.yaml#/FormType"
          reason:
            type: string
    estimated_seconds:
      type: integer
    poll_url:
      type: string

FormRecord:
  type: object
  required:
    - form_id
    - template_id
    - form_type
    - status
    - incident_id
  properties:
    form_id:
      type: string
      format: uuid
    template_id:
      type: string
      format: uuid
      description: Template this form was generated from
    form_type:
      $ref: "../schemas/enums.yaml#/FormType"
    status:
      $ref: "../schemas/enums.yaml#/FormStatus"
    incident_id:
      type: string
      format: uuid
      description: Incident this form was filled from. The extraction is
        reachable through the incident; forms do not link it directly.
    batch_id:
      type: string
      format: uuid
      nullable: true
    created_at:
      type: string
      format: date-time
    completed_at:
      type: string
      format: date-time
      nullable: true
    pdf_ready:
      type: boolean
    json_ready:
      type: boolean
    field_mapping_summary:
      type: object
      properties:
        total_form_fields:
          type: integer
        fields_filled:
          type: integer
        fields_blank:
          type: integer
        coverage_percent:
          type: number

FormMappedJson:
  type: object
  required:
    - form_type
    - form_id
  properties:
    form_type:
      $ref: "../schemas/enums.yaml#/FormType"
    form_version:
      type: string
    form_id:
      type: string
      format: uuid
    template_id:
      type: string
      format: uuid
    incident_id:
      type: string
      format: uuid
    agency_fields:
      type: object
      additionalProperties: true
      description: Agency-specific field names and values as the target system expects

BatchStatus:
  type: object
  required:
    - batch_id
    - status
  properties:
    batch_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [processing, completed, failed]
    total:
      type: integer
    completed:
      type: integer
    failed:
      type: integer
    forms:
      type: array
      items:
        type: object
        properties:
          form_id:
            type: string
            format: uuid
          template_id:
            type: string
            format: uuid
          form_type:
            $ref: "../schemas/enums.yaml#/FormType"
          status:
            $ref: "../schemas/enums.yaml#/FormStatus"
    download_url:
      type: string
      nullable: true
      description: Zip bundle of all completed PDFs, present once the batch
        finishes with at least one PDF to bundle
        (GET /api/v1/forms/batch/{batch_id}/download)

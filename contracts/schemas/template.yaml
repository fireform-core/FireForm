# Template & Configuration schemas

TemplateSummary:
  type: object
  properties:
    template_id:
      type: string
      format: uuid
    form_type:
      type: string
      description: Unique form type identifier (built-in or custom jurisdiction)
    display_name:
      type: string
    jurisdiction:
      type: string
      nullable: true
      description: Jurisdiction code (e.g. "US-Federal", "US-CA", "US-GA")
    agency_type:
      type: string
      nullable: true
    version:
      type: string
    last_updated:
      type: string
      format: date
    field_count:
      type: integer
    status:
      type: string
      enum:
        - active
        - legacy
        - draft

CreateTemplateRequest:
  type: object
  required:
    - form_type
    - display_name
    - fields
  properties:
    form_type:
      type: string
      description: Unique form type identifier
    display_name:
      type: string
    jurisdiction:
      type: string
      nullable: true
      description: Jurisdiction code. Optional — the visual editor may register a
        template before jurisdiction is assigned.
    agency_type:
      type: string
      nullable: true
    fields:
      type: array
      items:
        $ref: "#/TemplateField"
    source_standard:
      type: string
      nullable: true
      description: Reference to the source standard (e.g. "NERIS v2.0", "NFIRS 5.0")
    pdf_template_ref:
      type: string
      nullable: true
      description: Reference to the PDF template file the layout coordinates apply to

Template:
  allOf:
    - type: object
      properties:
        template_id:
          type: string
          format: uuid
        version:
          type: string
        last_updated:
          type: string
          format: date
        field_count:
          type: integer
        status:
          type: string
          enum: [active, legacy, draft]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    - $ref: "#/CreateTemplateRequest"

TemplateField:
  type: object
  required:
    - field_name
    - field_type
    - required
  properties:
    field_name:
      type: string
      description: Field identifier within this template
    field_type:
      type: string
      enum:
        - string
        - integer
        - number
        - boolean
        - date
        - datetime
        - time
        - enum
        - text
        - array
      description: Data type of the field
    required:
      type: boolean
    description:
      type: string
      nullable: true
    max_length:
      type: integer
      nullable: true
    min_value:
      type: number
      nullable: true
    max_value:
      type: number
      nullable: true
    allowed_values:
      type: array
      items:
        type: string
      nullable: true
      description: Valid values for enum fields
    incident_mapping:
      type: string
      nullable: true
      description: |
        JSON path in the FireForm incident schema this field pulls its value from
        (e.g. "fire.cause_category"). Null for a static field. Exactly one of
        incident_mapping or static_text is expected.
    static_text:
      type: string
      nullable: true
      description: |
        Fixed text drawn into the field instead of a mapped value. Null for a
        data-mapped field. Mutually exclusive with incident_mapping.
    default_value:
      nullable: true
      description: Default value if the mapped incident field is null
    layout:
      nullable: true
      description: Visual placement of the field on the PDF. Null for fields with
        no fixed position.
      allOf:
        - $ref: "#/TemplateFieldLayout"

TemplateFieldLayout:
  type: object
  description: |
    Visual placement of a field on the PDF page. Coordinates are in PDF points
    with the origin at the bottom-left of the page, so the field box runs from
    start = (x, y) to end = (x + width, y + height). The editor is responsible
    for converting rendered-canvas pixels to PDF points before saving.
  required:
    - page
    - x
    - y
    - width
    - height
  properties:
    page:
      type: integer
      description: Zero-based page index
    x:
      type: number
      description: Lower-left X of the box, in PDF points
    y:
      type: number
      description: Lower-left Y of the box, in PDF points (origin bottom-left)
    width:
      type: number
    height:
      type: number
    font:
      type: string
      default: Helvetica
    font_size:
      type: number
      default: 10
    color:
      type: string
      default: "#000000"
      description: Hex color, e.g. "#000000"
    align:
      type: string
      enum:
        - left
        - center
        - right
      default: left

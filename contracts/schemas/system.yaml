# System & health check schemas

HealthStatus:
  type: object
  required:
    - status
    - version
  properties:
    status:
      type: string
      enum:
        - healthy
        - degraded
        - unhealthy
    version:
      type: string
      description: FireForm API version
    uptime_seconds:
      type: integer
    components:
      type: object
      properties:
        database:
          $ref: "#/ComponentHealth"
        llm:
          $ref: "#/ComponentHealth"
        whisper:
          $ref: "#/ComponentHealth"
        storage:
          $ref: "#/ComponentHealth"

ComponentHealth:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - healthy
        - degraded
        - unhealthy
    response_time_ms:
      type: integer
      nullable: true
    detail:
      type: string
      nullable: true
    disk_free_gb:
      type: number
      nullable: true
      description: Free disk space (storage component)
    provider:
      type: string
      nullable: true
      description: Configured LLM provider (llm component)
      enum:
        - ollama
        - openai
        - gemini
        - anthropic
        - custom
    model:
      type: string
      nullable: true
      description: Model this deployment sends prompts to (llm component)
    external:
      type: boolean
      nullable: true
      description: >
        True when prompts leave this machine, which is the case for every
        hosted provider (llm component)
    probed:
      type: boolean
      nullable: true
      description: >
        Whether the status came from a live call. Hosted providers are not
        probed, because a call on every health check spends quota to answer a
        question the configuration already answers (llm component)
    models_available:
      type: array
      nullable: true
      description: Models the provider will serve (llm component)
      items:
        type: string

SchemaVersion:
  type: object
  required:
    - version
    - released_at
  properties:
    version:
      type: string
    released_at:
      type: string
      format: date-time
    changelog:
      type: string
    breaking_changes:
      type: boolean

# System & health check schemas

HealthStatus:
  type: object
  required:
    - status
    - version
  properties:
    status:
      $ref: "enums.yaml#/HealthState"
    version:
      type: string
      description: FireForm API version
    uptime_seconds:
      type: integer
    components:
      type: object
      properties:
        database:
          $ref: "#/ComponentHealth"
        llm:
          $ref: "#/ComponentHealth"
        whisper:
          $ref: "#/ComponentHealth"
        storage:
          $ref: "#/ComponentHealth"

ComponentHealth:
  type: object
  required:
    - status
  properties:
    status:
      $ref: "enums.yaml#/HealthState"
    response_time_ms:
      type: integer
      nullable: true
    detail:
      type: string
      nullable: true
    provider:
      $ref: "enums.yaml#/LLMProvider"
    model_loaded:
      type: string
      nullable: true
      description: Model loaded in memory right now. Only Ollama reports this (llm component)
    disk_free_gb:
      type: number
      nullable: true
      description: Free disk space (storage component)
    provider_version:
      type: string
      nullable: true
      description: LLM server version. Only Ollama reports this (llm component)
    models_available:
      type: array
      nullable: true
      description: Models the LLM server offers (llm component)
      items:
        type: object
        required:
          - name
        properties:
          name:
            type: string
          size_gb:
            type: number
            nullable: true
            description: Only Ollama reports this
          quantization:
            type: string
            nullable: true
            description: Only Ollama reports this
          loaded:
            type: boolean
            nullable: true
            description: Only Ollama reports this
    current_load:
      type: object
      nullable: true
      description: Current processing load (llm component)
      properties:
        active_requests:
          type: integer
        queued_requests:
          type: integer

SchemaVersion:
  type: object
  required:
    - version
    - released_at
  properties:
    version:
      type: string
    released_at:
      type: string
      format: date-time
    changelog:
      type: string
    breaking_changes:
      type: boolean

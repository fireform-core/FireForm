# System & health check schemas

HealthStatus:
  type: object
  required:
    - status
    - version
  properties:
    status:
      $ref: "enums.yaml#/HealthState"
    version:
      type: string
      description: FireForm API version
    uptime_seconds:
      type: integer
    components:
      type: object
      properties:
        database:
          $ref: "#/ComponentHealth"
        llm:
          $ref: "#/ComponentHealth"
        whisper:
          $ref: "#/ComponentHealth"
        storage:
          $ref: "#/ComponentHealth"

ComponentHealth:
  type: object
  required:
    - status
  properties:
    status:
      $ref: "enums.yaml#/HealthState"
    response_time_ms:
      type: integer
      nullable: true
    detail:
      type: string
      nullable: true
    provider:
      $ref: "enums.yaml#/LLMProvider"
    model_loaded:
      type: string
      nullable: true
      description: Model loaded in memory right now. Only Ollama reports this (llm component)
    disk_free_gb:
      type: number
      nullable: true
      description: Free disk space (storage component)
    provider_version:
      type: string
      nullable: true
      description: LLM server version. Only Ollama reports this (llm component)
    models_available:
      type: array
      nullable: true
      description: Models the LLM server offers (llm component)
      items:
        $ref: "#/LLMModel"
    current_load:
      type: object
      nullable: true
      description: Current processing load (llm component)
      properties:
        active_requests:
          type: integer
        queued_requests:
          type: integer

LLMModel:
  type: object
  required:
    - name
  properties:
    name:
      type: string
    size_gb:
      type: number
      nullable: true
      description: Only Ollama reports this
    quantization:
      type: string
      nullable: true
      description: Only Ollama reports this
    loaded:
      type: boolean
      nullable: true
      description: Only Ollama reports this
    installed:
      type: boolean
      nullable: true
      description: True when the model is present on the Ollama host (Ollama only)
    manual:
      type: boolean
      nullable: true
      description: True when the model ID was manually entered and validated

DownloadableModel:
  type: object
  required:
    - name
    - installed
  properties:
    name:
      type: string
    installed:
      type: boolean
      description: Always false in downloadable; the model is not on Ollama yet

LLMModelChoice:
  type: object
  required:
    - provider
    - model
  properties:
    provider:
      $ref: "enums.yaml#/LLMProvider"
    model:
      type: string

LLMProviderModels:
  type: object
  required:
    - provider
    - available
    - models
  properties:
    provider:
      $ref: "enums.yaml#/LLMProvider"
    available:
      type: boolean
      description: False when the provider could not be reached. Its models list
        is then empty, since nothing can run on it.
    default_model:
      type: string
      nullable: true
      description: Model used when a request names this provider but no model
    detail:
      type: string
      nullable: true
      description: Why the provider is unavailable
    error_code:
      type: string
      nullable: true
      description: Machine readable reason, one of LLM_AUTH_FAILED (key rejected),
        LLM_UNAVAILABLE (can't be reached or timed out), LLM_RATE_LIMITED (rate
        limited or out of quota), LLM_MODEL_NOT_FOUND, LLM_BAD_RESPONSE
    models:
      type: array
      description: Models that can be picked. With <PROVIDER>_MODELS=* this is
        everything the provider lists. Otherwise it is the configured names the
        provider actually offers. Hosted providers give only the name, Ollama
        adds size_gb, quantization and loaded. Fields without a value are left
        out of the response, here and on the provider.
      items:
        $ref: "#/LLMModel"
    downloadable:
      type: array
      nullable: true
      description: Ollama models that may be pulled but are not installed yet.
        Omitted for non-Ollama providers and when no models are downloadable.
      items:
        $ref: "#/DownloadableModel"

LLMProviderCredentialRequest:
  type: object
  additionalProperties: false
  properties:
    api_key:
      type: string
      nullable: true
      writeOnly: true
      description: Optional provider API key. Never returned by the API.
    base_url:
      type: string
      nullable: true
      description: Only accepted for the custom provider
    structured_output:
      type: boolean
      nullable: true
      description: Only accepted for the custom provider

LLMProviderCredentialStatus:
  type: object
  required: [provider, configured, source, enabled, external]
  properties:
    provider:
      $ref: "enums.yaml#/LLMProvider"
    configured:
      type: boolean
    source:
      type: string
      enum: [env, ui, none]
    key_hint:
      type: string
      nullable: true
      description: Last four characters only; the full key is never returned
    enabled:
      type: boolean
    external:
      type: boolean
    credential_status:
      type: string
      nullable: true
      enum: [available, unavailable]
    base_url:
      type: string
      nullable: true
    structured_output:
      type: boolean
      nullable: true

LLMProviderCredentialList:
  type: object
  required: [providers]
  properties:
    providers:
      type: array
      items:
        $ref: "#/LLMProviderCredentialStatus"

LLMExternalConsent:
  type: object
  required: [allow_external, source]
  properties:
    allow_external:
      type: boolean
    source:
      type: string
      enum: [env, ui, none]

LLMExternalConsentRequest:
  type: object
  required: [allow_external]
  properties:
    allow_external:
      type: boolean

LLMProviderValidationResult:
  type: object
  required: [provider, ok, models]
  properties:
    provider:
      $ref: "enums.yaml#/LLMProvider"
    ok:
      type: boolean
    models:
      type: array
      items:
        $ref: "#/LLMModel"
    detail:
      type: string
      nullable: true
    error_code:
      type: string
      nullable: true

LLMManualModelRequest:
  type: object
  required: [model]
  properties:
    model:
      type: string
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._\\-/:]*$"

LLMManualModelResult:
  type: object
  required: [provider, model, ok]
  properties:
    provider:
      $ref: "enums.yaml#/LLMProvider"
    model:
      type: string
    ok:
      type: boolean
    detail:
      type: string
      nullable: true
    error_code:
      type: string
      nullable: true

LLMPullRequest:
  type: object
  required:
    - model
  properties:
    model:
      type: string
      description: Ollama model tag to pull
    provider:
      type: string
      nullable: true
      default: ollama
      description: Must be ollama; other providers are rejected

LLMModels:
  type: object
  required:
    - default
    - providers
  properties:
    default:
      $ref: "#/LLMModelChoice"
    providers:
      type: array
      description: Every enabled provider. Providers without settings, or
        refused because they are outside the local network, are left out.
      items:
        $ref: "#/LLMProviderModels"

LLMTestRequest:
  type: object
  properties:
    provider:
      allOf:
        - $ref: "enums.yaml#/LLMProvider"
      nullable: true
      description: Defaults to the configured default provider
    model:
      type: string
      nullable: true
      description: Defaults to the provider's default model

LLMTestResult:
  type: object
  required:
    - provider
    - model
    - ok
  properties:
    provider:
      $ref: "enums.yaml#/LLMProvider"
    model:
      type: string
    ok:
      type: boolean
      description: True when the model answered a short prompt with valid JSON
    latency_ms:
      type: integer
      nullable: true
    detail:
      type: string
      nullable: true
      description: The error, when ok is false
    error_code:
      type: string
      nullable: true
      description: Machine readable reason, one of LLM_AUTH_FAILED (key rejected),
        LLM_UNAVAILABLE (can't be reached or timed out), LLM_RATE_LIMITED (rate
        limited or out of quota), LLM_MODEL_NOT_FOUND, LLM_BAD_RESPONSE

SchemaVersion:
  type: object
  required:
    - version
    - released_at
  properties:
    version:
      type: string
    released_at:
      type: string
      format: date-time
    changelog:
      type: string
    breaking_changes:
      type: boolean

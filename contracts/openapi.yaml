openapi: 3.0.0

info:
  title: FireForm API
  version: 1.0.0
  description: |
    Proposed API contract for FireForm as GSoC project 2026 by [chetanr25.in](https://chetanr25.in)
  contact:
    name: Chetan R
    url: https://github.com/chetanr25
    email: chetan250204@gmail.com

servers:
  - url: http://localhost:8000
    description: Local FireForm instance (default)

tags:
  - name: input
    description: Submit voice or text incident narratives
  - name: forms
    description: Generate agency-specific PDF forms from extracted data
  - name: templates
    description: Form template configuration and management
  - name: system
    description: Health checks, schema introspection, and system status
  - name: jobs
    description: Cross-cutting async job status polling
  - name: weather
    description: Weather forecast lookup via external API
  - name: zipcode
    description: Address and postal code geocoding via external API
  - name: profiles
    description: Profile of the person filling forms
  - name: reporting
    description: Periodic aggregate report generation and statistics

paths:
  # ── Layer 1: Input ──────────────────────────────────────────────
  /api/v1/input/voice:
    $ref: "path/input.yaml#/voice"
  /api/v1/input/text:
    $ref: "path/input.yaml#/text"
  /api/v1/input/{input_id}:
    $ref: "path/input.yaml#/input_by_id"

  # ── Layer 3: Form Fill ──────────────────────────────────────────
  /api/v1/forms/fill:
    $ref: "path/forms.yaml#/fill"
  /api/v1/forms/jobs:
    $ref: "path/forms.yaml#/async_fill"
  /api/v1/forms/models:
    $ref: "path/forms.yaml#/models"
  /api/v1/forms/transcribe:
    $ref: "path/forms.yaml#/transcribe"
  /api/v1/forms/submissions:
    $ref: "path/forms.yaml#/submissions"
  /api/v1/forms/submissions/analytics:
    $ref: "path/forms.yaml#/submissions_analytics"
  /api/v1/forms/purge:
    $ref: "path/forms.yaml#/purge"
  /api/v1/forms/{submission_id}:
    $ref: "path/forms.yaml#/submission_by_id"

  # ── Layer 4: Reporting ──────────────────────────────────────────
  /api/v1/reports/generate:
    $ref: "path/reporting.yaml#/generate"
  /api/v1/reports/{report_id}:
    $ref: "path/reporting.yaml#/report_by_id"

  # ── Layer 6: Templates & Configuration ─────────────────────────
  /api/v1/templates:
    $ref: "path/templates.yaml#/templates"
  /api/v1/templates/upload:
    $ref: "path/templates.yaml#/templates_upload"
  /api/v1/templates/preview:
    $ref: "path/templates.yaml#/templates_preview"
  /api/v1/templates/create:
    $ref: "path/templates.yaml#/templates_create"
  /api/v1/templates/make-fillable:
    $ref: "path/templates.yaml#/templates_make_fillable"
  /api/v1/templates/{template_id}:
    $ref: "path/templates.yaml#/template_by_id"

  # ── Layer 7: System ────────────────────────────────────────────
  /api/v1/health:
    $ref: "path/system.yaml#/health"
  /api/v1/schema/incident:
    $ref: "path/system.yaml#/schema_incident"
  /api/v1/schema/incident/versions:
    $ref: "path/system.yaml#/schema_versions"
  /api/v1/system/llm/models:
    $ref: "path/system.yaml#/llm_models"
  /api/v1/system/llm/test:
    $ref: "path/system.yaml#/llm_test"
  /api/v1/system/llm/pull:
    $ref: "path/system.yaml#/llm_pull"
  /api/v1/system/llm/providers/config:
    $ref: "path/system.yaml#/llm_provider_configs"
  /api/v1/system/llm/providers/config/{provider}:
    $ref: "path/system.yaml#/llm_provider_config"
  /api/v1/system/llm/providers/config/{provider}/validate:
    $ref: "path/system.yaml#/llm_provider_validation"
  /api/v1/system/llm/providers/config/{provider}/models:
    $ref: "path/system.yaml#/llm_manual_models"
  /api/v1/system/llm/external-consent:
    $ref: "path/system.yaml#/llm_external_consent"

  # ── Layer 8: Async Jobs ────────────────────────────────────────
  /api/v1/jobs/{job_id}:
    $ref: "path/jobs.yaml#/job_by_id"

  # ── Layer 9: External APIs ─────────────────────────────────────
  /api/v1/weather/forecast:
    $ref: "path/weather.yaml#/forecast"
  /api/v1/zipcode/lookup-address:
    $ref: "path/zipcode.yaml#/lookup_address"

  # ── Profiles ───────────────────────────────────────────────────
  /api/v1/profiles/:
    $ref: "path/profiles.yaml#/profiles"
  /api/v1/profiles/{profile_id}:
    $ref: "path/profiles.yaml#/profile_by_id"

components:
  securitySchemes:
    # Only enforced when FIREFORM_API_KEY is set; either scheme is accepted.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer

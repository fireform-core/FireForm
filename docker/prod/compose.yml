services:
  ollama:
    image: ollama/ollama:latest
    container_name: fireform-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fireform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: fireform-whisper
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=${WHISPER_MODEL}
      - ASR_MODEL_PATH=/data/whisper
    volumes:
      - whisper_models:/data/whisper
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - fireform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/docs')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: fireform-redis
    volumes:
      - redis_data:/data
    networks:
      - fireform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: fireform-app
    depends_on:
      ollama:
        condition: service_healthy
      whisper:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # Under /app (the project root) so uploaded and filled PDFs pass the
      # "inside the project" path guard and persist across container updates.
      - fireform_uploads:/app/data
    ports:
      - "${APP_PORT}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-}
      - LLM_ALLOW_EXTERNAL=${LLM_ALLOW_EXTERNAL:-false}
      - LLM_STRUCTURED_OUTPUT=${LLM_STRUCTURED_OUTPUT:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE-0}
      - WHISPER_HOST=${WHISPER_HOST}
      - FIREFORM_DATA_DIR=/app/data
      - FIREFORM_TEMPLATE_DIR=data/inputs
      - FIREFORM_DB_ECHO=false
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS}
      - WEB_CONCURRENCY=${GUNICORN_WORKERS}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - fireform-network
    restart: unless-stopped

  # Runs the async fill (/forms/jobs) and voice transcription (/input/voice)
  # jobs. Same image as the app; skips the entrypoint because the app already
  # runs the migrations.
  celery-worker:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: fireform-celery-worker
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: []
    command: ["celery", "-A", "app.core.celery:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - fireform_uploads:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - WHISPER_HOST=${WHISPER_HOST}
      - FIREFORM_DATA_DIR=/app/data
      - FIREFORM_TEMPLATE_DIR=data/inputs
      - FIREFORM_DB_ECHO=false
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - fireform-network
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
  whisper_models:
    driver: local
  fireform_uploads:
    driver: local
  redis_data:
    driver: local

networks:
  fireform-network:
    driver: bridge

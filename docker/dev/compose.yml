services:
  postgres:
    image: postgres:17-alpine
    container_name: fireform-postgres
    environment:
      POSTGRES_USER: fireform
      POSTGRES_PASSWORD: fireform
      POSTGRES_DB: fireform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - fireform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  ollama:
    image: ollama/ollama:latest
    container_name: fireform-ollama
    environment:
      # The server side of the extraction worker's parallelism. Both read the
      # same variable so they cannot drift apart.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fireform-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: fireform-whisper
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=${WHISPER_MODEL:-small.en}
      - ASR_MODEL_PATH=/data/whisper
    volumes:
      - whisper_models:/data/whisper
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - fireform-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/docs')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s

  redis:
    image: redis:7-alpine
    container_name: fireform-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fireform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: fireform-app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      whisper:
        condition: service_started
      redis:
        condition: service_healthy
    entrypoint: ["sh", "docker/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../..:/app
      - fireform_uploads:/data/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    # Everything in the env file reaches the container, so a new setting works
    # without being listed twice. The block below still wins where a container
    # needs a different value than the host (service names, data dirs).
    env_file:
      - ../.env.dev
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://fireform:fireform@postgres:5432/fireform
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-1200}
      - WHISPER_HOST=${WHISPER_HOST:-http://whisper:9000}
      - FIREFORM_DATA_DIR=/data/uploads
      - FIREFORM_TEMPLATE_DIR=/data/uploads
      - FIREFORM_DB_ECHO=${FIREFORM_DB_ECHO:-true}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - fireform-network

  celery-worker:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: fireform-celery-worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - ../..:/app
      - fireform_uploads:/data/uploads
    env_file:
      - ../.env.dev
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://fireform:fireform@postgres:5432/fireform
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-1200}
      - FIREFORM_DATA_DIR=/data/uploads
      - FIREFORM_TEMPLATE_DIR=/data/uploads
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - fireform-network

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  whisper_models:
    driver: local
  fireform_uploads:
    driver: local
  redis_data:
    driver: local

networks:
  fireform-network:
    driver: bridge

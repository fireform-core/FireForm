services:
  postgres:
    image: postgres:17-alpine
    container_name: fireform-postgres
    environment:
      POSTGRES_USER: fireform
      POSTGRES_PASSWORD: fireform
      POSTGRES_DB: fireform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - fireform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireform"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: fireform-ollama
    # Bundled Ollama is opt-in. Started only with the bundled-ollama profile
    # (the Makefile's COMPOSE adds it by default). Omit the profile to run
    # Ollama natively on the host instead — see Makefile 'up-native' and
    # OLLAMA_HOST in .env.example.
    profiles: ["bundled-ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fireform-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: fireform-whisper
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=${WHISPER_MODEL:-small.en}
      - ASR_MODEL_PATH=/data/whisper
    volumes:
      - whisper_models:/data/whisper
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - fireform-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/docs')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: fireform-app
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_started
    # No hard dependency on Ollama: it may run as the bundled container OR
    # natively on the host, so startup order can't be guaranteed either way.
    # app/services/llm.py retries the connection, which covers both modes.
    extra_hosts:
      # Lets OLLAMA_HOST=http://host.docker.internal:11434 reach a host-native
      # Ollama. Automatic on Docker Desktop (Mac/Win); host-gateway adds Linux.
      - "host.docker.internal:host-gateway"
    entrypoint: ["sh", "docker/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../..:/app
      - fireform_uploads:/data/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://fireform:fireform@postgres:5432/fireform
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - WHISPER_HOST=${WHISPER_HOST:-http://whisper:9000}
      - FIREFORM_DATA_DIR=/data/uploads
      - FIREFORM_TEMPLATE_DIR=/data/uploads
      - FIREFORM_DB_ECHO=${FIREFORM_DB_ECHO:-true}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    networks:
      - fireform-network

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  whisper_models:
    driver: local
  fireform_uploads:
    driver: local

networks:
  fireform-network:
    driver: bridge

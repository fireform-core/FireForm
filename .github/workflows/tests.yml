name: Tests

on:
  push:
    branches: [main, development]  # post-merge verification after PRs land
  pull_request:
    branches: [main, development, 'development-*']  # gates all PRs

jobs:
  test:
    runs-on: ubuntu-latest

    # Tests use SQLite in-memory via conftest.py — no external database service needed.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Check for un-migrated model changes (SQLite)
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///ci_migration_check.db
        run: |
          python -m alembic upgrade head
          python -m alembic check